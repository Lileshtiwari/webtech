<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Outer Bowl Rim with Shadow -->
  <defs>
    <filter id="bowlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="bowlGradient" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FAF5EE"/>
      <stop offset="95%" stop-color="#E2D7C5"/>
      <stop offset="100%" stop-color="#C5B59D"/>
    </radialGradient>
  </defs>

  <!-- Ceramic Bowl -->
  <circle cx="250" cy="250" r="230" fill="url(#bowlGradient)" filter="url(#bowlShadow)" stroke="#B5A48B" stroke-width="6"/>
  <circle cx="250" cy="250" r="205" fill="#1C2D1F"/>

  <!-- Base Greens & Spinach Bed -->
  <circle cx="250" cy="250" r="195" fill="#23462A"/>
  <!-- Leafy folds -->
  <path d="M120 200C90 260 120 340 180 370C150 310 160 240 210 200C160 180 130 180 120 200Z" fill="#2E6B39"/>
  <path d="M100 240C90 300 130 380 200 390C160 340 170 270 230 240C180 220 120 210 100 240Z" fill="#3D8B4D"/>
  <path d="M140 310C130 370 200 420 270 410C220 370 220 310 270 280C220 270 160 270 140 310Z" fill="#4DA860"/>

  <!-- Roasted Chickpeas & Grains Sector (Top Right) -->
  <path d="M250 80C340 80 410 150 410 240C370 240 320 200 300 170C280 140 260 100 250 80Z" fill="#E8D5B5"/>
  <!-- Chickpea Dots -->
  <circle cx="320" cy="140" r="9" fill="#D4A373"/>
  <circle cx="340" cy="160" r="10" fill="#CCA06E"/>
  <circle cx="360" cy="180" r="9" fill="#D4A373"/>
  <circle cx="300" cy="130" r="8" fill="#BC8A5F"/>
  <circle cx="330" cy="115" r="9" fill="#D4A373"/>
  <circle cx="370" cy="150" r="8" fill="#CCA06E"/>
  <circle cx="380" cy="200" r="10" fill="#D4A373"/>
  <circle cx="350" cy="210" r="9" fill="#BC8A5F"/>

  <!-- Purple Cabbage Section (Top Center) -->
  <path d="M210 70C270 65 310 100 310 140C270 160 230 140 210 120Z" fill="#581C87"/>
  <path d="M220 85C250 80 290 105 290 135" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M235 95C260 90 280 115 280 140" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M205 100C230 95 260 115 260 140" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Roasted Mushrooms Sector (Left Center) -->
  <g transform="translate(140, 160)">
    <!-- Mushroom 1 -->
    <path d="M20 30C20 15 45 10 55 25C60 35 45 40 35 40C25 40 20 35 20 30Z" fill="#5C3D2E"/>
    <ellipse cx="38" cy="26" rx="14" ry="8" fill="#784E38"/>
    <!-- Mushroom 2 -->
    <path d="M50 50C50 35 75 30 85 45C90 55 75 60 65 60C55 60 50 55 50 50Z" fill="#4A3125"/>
    <ellipse cx="68" cy="46" rx="14" ry="8" fill="#694330"/>
    <!-- Mushroom 3 -->
    <path d="M15 65C15 50 40 45 50 60C55 70 40 75 30 75C20 75 15 70 15 65Z" fill="#5C3D2E"/>
  </g>

  <!-- Ripe Cherry Tomatoes & Heirloom Tomato Halves -->
  <!-- Tomato 1 (Red Half) -->
  <g transform="translate(260, 260)">
    <circle cx="25" cy="25" r="22" fill="#DC2626"/>
    <circle cx="25" cy="25" r="18" fill="#EF4444"/>
    <circle cx="20" cy="20" r="4" fill="#FEF08A"/>
    <circle cx="30" cy="22" r="4" fill="#FEF08A"/>
    <circle cx="24" cy="30" r="4" fill="#FEF08A"/>
  </g>
  <!-- Tomato 2 (Yellow Heirloom Half) -->
  <g transform="translate(310, 280)">
    <circle cx="20" cy="20" r="19" fill="#EAB308"/>
    <circle cx="20" cy="20" r="15" fill="#FACC15"/>
    <circle cx="16" cy="16" r="3.5" fill="#713F12"/>
    <circle cx="24" cy="18" r="3.5" fill="#713F12"/>
    <circle cx="19" cy="25" r="3.5" fill="#713F12"/>
  </g>
  <!-- Tomato 3 (Small Cherry) -->
  <circle cx="240" cy="300" r="15" fill="#B91C1C"/>
  <circle cx="236" cy="296" r="4" fill="#F87171" fill-opacity="0.6"/>

  <!-- Fresh Lime Wedge (Bottom Center) -->
  <g transform="translate(210, 315) rotate(-20)">
    <path d="M10 40C10 15 35 0 60 0C60 25 35 40 10 40Z" fill="#65A30D"/>
    <path d="M14 36C14 17 34 5 54 5C54 25 34 36 14 36Z" fill="#84CC16"/>
    <path d="M18 32C18 20 32 10 48 10C48 24 32 32 18 32Z" fill="#BEF264"/>
    <!-- Wedge segments -->
    <path d="M22 28L45 14" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M28 22L47 22" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Cucumber Slices (Top Right) -->
  <g transform="translate(330, 190)">
    <circle cx="20" cy="20" r="18" fill="#15803D" stroke="#14532D" stroke-width="3"/>
    <circle cx="20" cy="20" r="14" fill="#BBF7D0"/>
    <circle cx="17" cy="17" r="2" fill="#166534"/>
    <circle cx="23" cy="18" r="2" fill="#166534"/>
    <circle cx="19" cy="23" r="2" fill="#166534"/>
  </g>
  <g transform="translate(365, 230)">
    <circle cx="18" cy="18" r="16" fill="#15803D" stroke="#14532D" stroke-width="3"/>
    <circle cx="18" cy="18" r="12" fill="#BBF7D0"/>
  </g>
</svg>
