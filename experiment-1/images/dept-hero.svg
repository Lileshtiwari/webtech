<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="16" fill="#1E1B4B"/>
  <!-- Modern Engineering Campus Architectural Motif -->
  <path d="M0 260L120 180L240 260L360 160L480 240L600 140V360H0V260Z" fill="#312E81" fill-opacity="0.6"/>
  <path d="M0 300L160 210L320 300L480 200L600 280V360H0V300Z" fill="#4338CA" fill-opacity="0.5"/>
  <!-- Geometric Tech Grid Overlay -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <line x1="50" y1="120" x2="550" y2="120" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="120" cy="120" r="40" fill="#4F46E5" fill-opacity="0.3"/>
  <circle cx="120" cy="120" r="25" fill="#6366F1" fill-opacity="0.5"/>
  <circle cx="480" cy="100" r="60" fill="#38BDF8" fill-opacity="0.2"/>
  
  <!-- Campus Building Facade Silhouette -->
  <rect x="180" y="80" width="240" height="220" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
  <rect x="200" y="110" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="250" y="110" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="300" y="110" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="350" y="110" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="200" y="170" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="250" y="170" width="30" height="40" rx="3" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="300" y="170" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="350" y="170" width="30" height="40" rx="3" fill="#6366F1" fill-opacity="0.6"/>
  <rect x="260" y="240" width="60" height="60" rx="4" fill="#818CF8"/>

  <!-- Badge banner -->
  <rect x="40" y="40" width="160" height="32" rx="16" fill="#4F46E5"/>
  <text x="60" y="61" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">APEX CSE CAMPUS</text>
