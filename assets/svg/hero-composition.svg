<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" fill="none">
  <!-- Background canvas -->
  <rect width="540" height="360" rx="20" fill="#F8FAFC"/>
  
  <!-- Outer Browser Window Mockup -->
  <g filter="drop-shadow(0 12px 24px rgba(15, 23, 42, 0.08))">
    <rect x="30" y="30" width="480" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M30 68H510" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Window controls -->
    <circle cx="54" cy="49" r="5" fill="#EF4444"/>
    <circle cx="70" cy="49" r="5" fill="#F59E0B"/>
    <circle cx="86" cy="49" r="5" fill="#10B981"/>
    <!-- URL Bar -->
    <rect x="110" y="40" width="260" height="18" rx="6" fill="#F1F5F9"/>
    <path d="M125 49H140" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="53" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">webtech.io/engineering-hub</text>
  </g>

  <!-- Split View Left: Semantic Code Editor -->
  <rect x="50" y="85" width="200" height="225" rx="10" fill="#0F172A"/>
  <!-- Code lines -->
  <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818CF8">&lt;header&gt;</text>
  <text x="80" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">&lt;h1&gt;WebTech Hub&lt;/h1&gt;</text>
  <text x="65" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818CF8">&lt;/header&gt;</text>
  
  <text x="65" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F472B6">const</text>
  <text x="100" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">bmi = calc(w, h);</text>
  
  <text x="65" y="196" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">fetch</text>
  <text x="96" y="196" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">('/api/countries')</text>
  <text x="80" y="214" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">.then(res =&gt; res.json())</text>

  <text x="65" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24">&lt;?php</text>
  <text x="80" y="258" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">$pdo-&gt;prepare($sql);</text>
  <text x="65" y="276" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24">?&gt;</text>

  <!-- Split View Right: Live Web Interface Render -->
  <g transform="translate(265, 85)">
    <!-- Header banner in live mockup -->
    <rect x="0" y="0" width="225" height="42" rx="8" fill="#EEF2FF"/>
    <rect x="12" y="12" width="60" height="8" rx="3" fill="#4F46E5"/>
    <rect x="12" y="25" width="90" height="6" rx="2" fill="#94A3B8"/>
    <circle cx="195" cy="21" r="12" fill="#4F46E5" fill-opacity="0.15"/>
    <path d="M191 21L194 24L200 18" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Metric Card -->
    <rect x="0" y="52" width="105" height="75" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="10" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#64748B">BMI INDEX</text>
    <text x="10" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#4F46E5">22.45</text>
    <rect x="10" y="103" width="65" height="14" rx="4" fill="#ECFDF5"/>
    <text x="15" y="113" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#065F46">Normal Weight</text>

    <!-- Database Storage Card -->
    <rect x="115" y="52" width="110" height="75" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="125" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#64748B">SQL DATABASE</text>
    <path d="M130 84C130 80 145 78 160 78C175 78 190 80 190 84V108C190 112 175 114 160 114C145 114 130 112 130 108V84Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <ellipse cx="160" cy="84" rx="30" ry="4" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
    <path d="M130 92C130 96 145 98 160 98C175 98 190 96 190 92" stroke="#4F46E5" stroke-width="1.5"/>
    <path d="M130 100C130 104 145 106 160 106C175 106 190 100 190 100" stroke="#4F46E5" stroke-width="1.5"/>

    <!-- Food Delivery Order Track Bar -->
    <rect x="0" y="137" width="225" height="88" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="12" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0F172A">Active Food Order #1001</text>
    <rect x="165" y="145" width="48" height="14" rx="4" fill="#ECFDF5"/>
    <text x="170" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#065F46">CONFIRMED</text>
    
    <path d="M12 178H210" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 178H140" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="178" r="5" fill="#4F46E5"/>
    <circle cx="80" cy="178" r="5" fill="#4F46E5"/>
    <circle cx="140" cy="178" r="5" fill="#4F46E5"/>
    <circle cx="210" cy="178" r="4" fill="#CBD5E1"/>
    
    <text x="12" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B">Dum Biryani x1, Artisan Burger x1</text>
    <text x="12" y="213" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#4F46E5">Total: Rs 438.00</text>
  </g>
</svg>
