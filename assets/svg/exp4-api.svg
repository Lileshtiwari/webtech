<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <!-- Experiment 4: API Calls & JSON Processing -->
  <rect width="240" height="140" rx="10" fill="#F8FAFC"/>
  <!-- Central Globe Node -->
  <g transform="translate(45, 30)">
    <circle cx="40" cy="40" r="32" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <!-- Globe lines -->
    <ellipse cx="40" cy="40" rx="16" ry="32" stroke="#0284C7" stroke-width="1.2" fill="none"/>
    <path d="M8 40H72" stroke="#0284C7" stroke-width="1.2"/>
    <path d="M16 22H64" stroke="#0284C7" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="M16 58H64" stroke="#0284C7" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Dynamic Data Packet Arrows -->
  <path d="M125 55H150" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <path d="M145 50L152 55L145 60" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>

  <path d="M152 75H127" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <path d="M134 70L127 75L134 80" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

  <!-- JSON Payload Card -->
  <rect x="160" y="25" width="65" height="90" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="168" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">{ "res":</text>
  <text x="174" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F472B6">"200"</text>
  <text x="168" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#818CF8">"name":</text>
  <text x="174" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">"India"</text>
  <text x="168" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">}</text>
</svg>
