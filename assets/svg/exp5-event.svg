<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <!-- Experiment 5: Event Registration Form with PHP & MySQL -->
  <rect width="240" height="140" rx="10" fill="#F8FAFC"/>
  <!-- Event Calendar / Pass -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="85" height="100" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="85" height="24" rx="8" fill="#4F46E5"/>
    <!-- Calendar rings -->
    <circle cx="20" cy="8" r="3" fill="#FFFFFF"/>
    <circle cx="65" cy="8" r="3" fill="#FFFFFF"/>
    <text x="18" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF">OCTOBER</text>
    
    <text x="24" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#0F172A">24</text>
    <rect x="15" y="72" width="55" height="6" rx="3" fill="#EEF2FF"/>
    <text x="18" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#4F46E5">HACKATHON</text>
    <rect x="15" y="84" width="55" height="8" rx="2" fill="#ECFDF5"/>
    <text x="20" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#065F46">CONFIRMED</text>
  </g>

  <!-- Connective Pipe to Database -->
  <path d="M115 70H140" stroke="#4F46E5" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- MySQL Database Stack -->
  <g transform="translate(145, 22)">
    <rect x="0" y="0" width="70" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Cylinders -->
    <path d="M12 20C12 15 26 12 35 12C44 12 58 15 58 20V34C58 39 44 42 35 42C26 42 12 39 12 34V20Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <ellipse cx="35" cy="20" rx="23" ry="5" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
    
    <path d="M12 44C12 40 26 37 35 37C44 37 58 40 58 44V58C58 62 44 65 35 65C26 65 12 62 12 58V44Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <ellipse cx="35" cy="44" rx="23" ry="5" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
    
    <path d="M12 68C12 64 26 61 35 61C44 61 58 64 58 68V82C58 86 44 89 35 89C26 89 12 86 12 82V68Z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <ellipse cx="35" cy="68" rx="23" ry="5" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>
  </g>
